<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redeflex Board | Squad PIX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="brand">Redeflex</p>
          <h1>Demandas • Squad PIX</h1>
        </div>
        <button id="newDemandBtn" class="primary-btn">+ Nova Demanda</button>
      </header>

      <section class="summary-grid" aria-label="resumo de demandas">
        <article class="summary-card">
          <h2>Total</h2>
          <p id="totalCount">0 demandas</p>
        </article>
        <article class="summary-card">
          <h2>Em Desenvolvimento</h2>
          <p id="progressCount">0 demandas</p>
        </article>
        <article class="summary-card">
          <h2>Concluídas</h2>
          <p id="doneCount">0 demandas</p>
        </article>
      </section>

      <section id="storageBanner" class="storage-banner" aria-live="polite"></section>

      <main>
        <section id="board" class="board" aria-live="polite"></section>
      </main>
    </div>

    <dialog id="demandDialog" class="dialog">
      <form id="demandForm" method="dialog" class="dialog-content">
        <h2>Nova demanda</h2>
        <div class="form-grid">
          <label>
            ID (tabela)
            <input type="text" id="idInput" maxlength="60" placeholder="Ex: OPCOM_999" />
          </label>

          <label>
            Prioridade
            <select id="priorityInput" required>
              <option value="P_0 Crítica">P_0 Crítica</option>
              <option value="P_1 Alta">P_1 Alta</option>
              <option value="P_2 Média" selected>P_2 Média</option>
              <option value="P_3 Baixa">P_3 Baixa</option>
            </select>
          </label>
        </div>

        <label>
          Demanda
          <input type="text" id="titleInput" required maxlength="80" />
        </label>
             <div class="form-grid">
          <label>
            Produto
            <select id="productInput" required>
              <option value="ADQ" selected>ADQ</option>
              <option value="PIX">PIX</option>
            </select>
          </label>

          <label>
            Sistema
            <select id="systemInput" required>
              <option value="ALL" selected>All</option>
              <option value="Intraflex">Intraflex</option>
              <option value="RFM">RFM</option>
              <option value="Gestão Solver">Gestão Solver</option>
            </select>
          </label>
        </div>

        <div class="form-grid">
          <label>
            Plataforma
            <details id="platformInput" class="platform-select">
              <summary id="platformSummary">Selecione plataforma(s)</summary>
              <div class="platform-options">
                <label><input class="platform-option" type="checkbox" value="INTEGRAÇÃO-API" /> INTEGRAÇÃO-API</label>
                <label><input class="platform-option" type="checkbox" value="MOBILE" /> MOBILE</label>
                <label><input class="platform-option" type="checkbox" value="Switch Transacional" /> Switch Transacional</label>
                <label><input class="platform-option" type="checkbox" value="MtSol" /> MtSol</label>
                <label><input class="platform-option" type="checkbox" value="Banco de Dados" /> Banco de Dados</label>
              </div>
            </details>
          </label>
          <small class="field-hint">Selecione uma ou mais plataformas.</small>

          <label>
            Squad Team
            <input type="text" id="squadInput" maxlength="40" placeholder="Ex: PIX" value="PIX" />
          </label>
        </div>

        <div class="form-grid">
          <label>
            Type
            <select id="typeInput" required>
              <option value="Bug">Bug</option>
              <option value="Melhoria" selected>Melhoria</option>
              <option value="Tecnico">Tecnico</option>
              <option value="Projeto">Projeto</option>
            </select>
          </label>

          <label>
            Metodologia
            <select id="methodologyInput" required>
              <option value="Kanban" selected>Kanban</option>
              <option value="Scrum">Scrum</option>
            </select>
          </label>
        </div>

        <label>
           Descrição (opcional)
          <textarea id="descriptionInput" rows="3" maxlength="240" placeholder="Detalhes complementares"></textarea>
        </label>

        <label>
          Status
          <select id="statusInput" required>
      <option value="backlog">BackLog</option>
            <option value="Backlog">BackLog</option>
            <option value="Em Refinamento">Em Refinamento</option>
            <option value="Em Desenvolvimento">Em Desenvolvimento</option>
            <option value="Homologacao">Homologação</option>
            <option value="Teste QA">Teste QA</option>
            <option value="Concluido">Concluido</option>
            <option value="Impedido">Impedido</option>
          </select>
        </label>

        <menu>
          <button value="cancel" type="reset" id="cancelCreateBtn">Cancelar</button>
          <button value="default" class="primary-btn" type="submit">Salvar Demanda</button>
        </menu>
      </form>
    </dialog>

    <dialog id="detailsDialog" class="dialog">
      <form id="detailsForm" method="dialog" class="dialog-content">
        <h2 id="detailsTitle"></h2>
        <p id="detailsDescription" class="details-description"></p>
         <dl id="detailsMeta" class="details-meta"></dl>

        <label>
          Status
          <select id="detailsStatusInput" required>
            <option value="Backlog">BackLog</option>
            <option value="Em Refinamento">Em Refinamento</option>
            <option value="Em Desenvolvimento">Em Desenvolvimento</option>
            <option value="Homologacao">Homologação</option>
            <option value="Teste QA">Teste QA</option>
            <option value="Concluido">Concluido</option>
            <option value="Impedido">Impedido</option>
          </select>
        </label>

        <label>
          Atualização do P.O.
          <textarea id="detailsUpdateInput" rows="5" placeholder="Escreva aqui a atualização"></textarea>
        </label>

        <menu>
          <button value="cancel" type="reset" id="cancelDetailsBtn">Fechar</button>
          <button value="default" class="primary-btn" type="submit">Salvar atualização</button>
        </menu>
      </form>
    </dialog>

    <template id="demandTemplate">
      <article class="card" role="button" tabindex="0">
        <div class="card-head">
          <h3 class="card-title"></h3>
          <span class="chip"></span>
        </div>
        <p class="card-description"></p>
        <ul class="card-meta"></ul>
      </article>
    </template>

     <script src="config.js"></script>
    <script src="config.local.js"></script>
    <script src="sciprt.js"></script>
  </body>
</html>
